name: Run Gold Bot
on:
  schedule:
    - cron: '*/30 * * * *' # يعمل كل 30 دقيقة
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v3
      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.9'
      - name: Install requirements
        run: pip install requests telebot # أو المكتبات التي يستخدمها بوتك
      - name: Run script
        run: python gold_bot.py
