name: Run Gold Bot
on:
  schedule:
    # مُزاح عن الدقائق المدورة (00, 10, 20...) لتقليل الزحمة والتأخير في جدولة GitHub Actions
    - cron: '3,13,23,33,43,53 * * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v3
      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.9'
      - name: Install requirements
        run: pip install -r requirements.txt
      - name: Debug secret fingerprint (safe, no secret exposed)
        run: |
          echo "TELEGRAM_TOKEN length: ${#TELEGRAM_TOKEN}"
          echo "TELEGRAM_TOKEN sha256: $(printf '%s' "$TELEGRAM_TOKEN" | sha256sum | cut -d' ' -f1)"
          echo "CHAT_ID length: ${#CHAT_ID}"
        env:
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          CHAT_ID: ${{ secrets.CHAT_ID }}
      - name: Run script
        run: python gold_bot.py
        env:
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          CHAT_ID: ${{ secrets.CHAT_ID }}
      - name: Commit updated price state
        run: |
          if [ -n "$(git status --porcelain state.json)" ]; then
            git config user.name "github-actions[bot]"
            git config user.email "github-actions[bot]@users.noreply.github.com"
            git add state.json
            git commit -m "chore: update price state"
            git push
          fi
