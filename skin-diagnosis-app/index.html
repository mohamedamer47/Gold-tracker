<!DOCTYPE html>
<html lang="ar" dir="rtl" id="htmlRoot">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>تشخيص البشرة الذكي | Smart Skin Diagnosis</title>
<link rel="stylesheet" href="css/style.css">
</head>
<body>

<header class="app-header">
  <div class="brand">
    <span class="brand-icon">✨</span>
    <span class="brand-name" id="brandName"></span>
  </div>
  <div class="header-right">
    <div class="progress-wrap" id="progressWrap" hidden>
      <div class="progress-bar"><div class="progress-fill" id="progressFill"></div></div>
      <span class="progress-label" id="progressLabel">0%</span>
    </div>
    <div class="lang-switch" id="langSwitch">
      <button type="button" class="lang-btn" data-lang="ar">العربية</button>
      <button type="button" class="lang-btn" data-lang="en">English</button>
    </div>
  </div>
</header>

<main class="app-main">

  <!-- شاشة الترحيب / Welcome screen -->
  <section id="screen-intro" class="screen active">
    <div class="card intro-card">
      <h1 id="introTitle"></h1>
      <p class="lead" id="introLead"></p>

      <div class="pricing-grid">
        <div class="price-card">
          <div class="price-tag">$20</div>
          <h3 id="priceServiceTitle"></h3>
          <p id="priceServiceDesc"></p>
        </div>
        <div class="price-card featured">
          <div class="price-tag">$100</div>
          <h3 id="priceConsultTitle"></h3>
          <p id="priceConsultDesc"></p>
        </div>
      </div>

      <p class="disclaimer" id="disclaimerIntro"></p>

      <button class="btn btn-primary" id="btnStart"></button>
    </div>
  </section>

  <!-- شاشة الأسئلة / Quiz screen -->
  <section id="screen-quiz" class="screen">
    <div class="card quiz-card">
      <div id="questionContainer"></div>
      <div class="nav-buttons">
        <button class="btn btn-ghost" id="btnBack"></button>
        <button class="btn btn-primary" id="btnNext"></button>
      </div>
    </div>
  </section>

  <!-- شاشة تحميل بسيطة / Loading screen -->
  <section id="screen-loading" class="screen">
    <div class="card loading-card">
      <div class="spinner"></div>
      <p id="loadingText"></p>
    </div>
  </section>

  <!-- شاشة النتيجة / Result screen -->
  <section id="screen-result" class="screen">
    <div class="card result-card" id="resultContainer"></div>
  </section>

</main>

<footer class="app-footer">
  <p id="footerText"></p>
</footer>

<script src="js/i18n.js"></script>
<script src="js/questions.js"></script>
<script src="js/knowledge.js"></script>
<script src="js/app.js"></script>
</body>
</html>
